spring:
  profiles:
    active: local

  application:
    name: enrollment-system

  datasource:
    url: jdbc:mysql://localhost:3306/enrollment_system?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:init.sql